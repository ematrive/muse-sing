[package]
name = "muse-sing"
version = "0.8.0"
description = "MuseScore -> OpenUtau (DiffSinger) project converter"
authors = ["Emanuele Trivella"]
license = "MIT"
edition = "2024"

[lib]
name = "muse_sing_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
num-rational = "0.4"
thiserror = "2"
cpal = "0.18.2"
hound = "3.5.1"
ort = "=2.0.0-rc.15"
mp3lame-encoder = "0.3.0"
flacenc = "0.5.1"
rustysynth = "1.3"
# already used by the updater plugin: the same versions and features add no crates
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
claxon = "0.4"

# microphone permission (already used by cpal and tauri: no new crates)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

# the encoders are slow unoptimised: keep `tauri dev` exports quick
[profile.dev.package.flacenc]
opt-level = 3
[profile.dev.package.mp3lame-sys]
opt-level = 3
[profile.dev.package.claxon]
opt-level = 3
